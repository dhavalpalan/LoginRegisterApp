{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body p-4">
  <h4 class="mb-3">Change password</h4>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Current password</label>
      <input class="form-control" type="password" name="current" required></div>
    <div class="mb-3"><label class="form-label">New password</label>
      <input class="form-control" type="password" name="new" required></div>
    <div class="mb-3"><label class="form-label">Confirm new password</label>
      <input class="form-control" type="password" name="confirm" required></div>
    <button class="btn btn-primary w-100">Update password</button>
  </form>
</div></div>
{% endblock %}
