{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body p-4">
  <h4 class="mb-3">Log in</h4>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Username or email</label>
      <input class="form-control" name="identifier" required autofocus></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
